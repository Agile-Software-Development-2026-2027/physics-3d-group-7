[project]
name = "3d"
version = "0.1.0"
description = "Existing implementation of ApKit4D"
readme = "README.md"
authors = []
requires-python = ">=3.14"
dependencies = [
    "aicspylibczi>=4.0.1",
    "matplotlib>=3.11.2",
    "napari>=0.9.2",
    "napari-czitools>=0.12.4",
    "pylibczirw>=6.1.0",
]

[project.scripts]
3d = "3d:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
